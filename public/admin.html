<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dúvidas recebidas — Conviver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin-top: 1.5rem;
  }
  .admin-table {
    width: 100%;
    min-width: 560px;
    border-collapse: collapse;
    font-size: 0.95rem;
  }
  .admin-table th,
  .admin-table td {
    text-align: left;
    padding: 0.6rem 0.7rem;
    border-bottom: 1px solid var(--color-line);
    vertical-align: top;
  }
  .admin-table th {
    font-family: var(--font-display);
    color: var(--color-primary-dark);
  }
  .admin-actions {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 1rem;
  }
  .admin-actions input {
    max-width: 220px;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" href="index.html">Conviver</a>
    <nav class="site-nav" id="site-nav">
      <a href="constituicao.html">Constituição</a>
      <a href="estatuto-do-idoso.html">Estatuto do Idoso</a>
      <a href="bpc-loas.html">BPC</a>
      <a href="servicos.html">Serviços</a>
      <a href="duvidas.html">Dúvidas</a>
    </nav>
    <div class="header-actions">
      <div class="font-size-control" role="group" aria-label="Ajustar tamanho do texto">
        <button type="button" data-font-step="-1" aria-label="Diminuir texto">A-</button>
        <button type="button" data-font-step="0" aria-label="Texto padrão">A</button>
        <button type="button" data-font-step="1" aria-label="Aumentar texto">A+</button>
      </div>
      <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Abrir menu">
        <span class="nav-toggle-icon"><span></span><span></span><span></span></span>
        <span class="nav-toggle-label">Menu</span>
      </button>
    </div>
  </div>
</header>

<main class="page">
  <div class="page-inner" style="max-width: 100%;">
    <h1>Dúvidas recebidas</h1>
    <p class="lead">Página de uso interno. Digite a chave de acesso para ver as dúvidas enviadas pelo formulário.</p>

    <div class="admin-actions">
      <input type="password" id="chave" placeholder="Chave de acesso" autocomplete="off">
      <button type="button" class="button button-primary" id="botao-ver">Ver dúvidas</button>
      <button type="button" class="button" id="botao-baixar" style="display:none; border-color: var(--color-primary); color: var(--color-primary-dark);">Baixar como texto</button>
    </div>

    <p id="status" role="status" aria-live="polite" style="font-weight:700; margin-top: 1rem;"></p>

    <div id="resultado"></div>
  </div>
</main>

<script src="js/main.js"></script>
<script>
  let ultimosDados = [];

  function formatarData(iso) {
    const data = new Date(iso);
    return data.toLocaleString('pt-BR');
  }

  function renderizarTabela(dados) {
    const container = document.getElementById('resultado');

    if (dados.length === 0) {
      container.innerHTML = '<p>Nenhuma dúvida recebida até agora.</p>';
      return;
    }

    const linhas = dados.map((item) => `
      <tr>
        <td>${item.nome}</td>
        <td>${item.telefone || '-'}</td>
        <td>${item.mensagem}</td>
        <td>${formatarData(item.criado_em)}</td>
      </tr>
    `).join('');

    container.innerHTML = `
      <div class="table-scroll">
        <table class="admin-table">
          <thead>
            <tr><th>Nome</th><th>Telefone</th><th>Dúvida</th><th>Recebido em</th></tr>
          </thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>
    `;
  }

  async function buscarDuvidas() {
    const chave = document.getElementById('chave').value;
    const status = document.getElementById('status');
    const botaoBaixar = document.getElementById('botao-baixar');

    status.textContent = 'Buscando...';

    try {
      const resposta = await fetch('/api/duvidas?chave=' + encodeURIComponent(chave));
      const dados = await resposta.json();

      if (!resposta.ok) {
        status.textContent = dados.erro || 'Não foi possível verificar a chave.';
        document.getElementById('resultado').innerHTML = '';
        botaoBaixar.style.display = 'none';
        return;
      }

      ultimosDados = dados;
      status.textContent = dados.length + ' dúvida(s) encontrada(s).';
      renderizarTabela(dados);
      botaoBaixar.style.display = dados.length ? 'inline-block' : 'none';
    } catch (erro) {
      status.textContent = 'Sem conexão no momento.';
    }
  }

  function baixarComoTexto() {
    const linhas = ultimosDados.map((item) =>
      `Nome: ${item.nome}\nTelefone: ${item.telefone || '-'}\nDúvida: ${item.mensagem}\nRecebido em: ${formatarData(item.criado_em)}\n---`
    );
    const conteudo = linhas.join('\n\n');
    const blob = new Blob([conteudo], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    const link = document.createElement('a');
    link.href = url;
    link.download = 'duvidas-conviver.txt';
    link.click();

    URL.revokeObjectURL(url);
  }

  document.getElementById('botao-ver').addEventListener('click', buscarDuvidas);
  document.getElementById('botao-baixar').addEventListener('click', baixarComoTexto);
  document.getElementById('chave').addEventListener('keydown', (evento) => {
    if (evento.key === 'Enter') buscarDuvidas();
  });
</script>
</body>
</html>
